# Nginx site config for Cyber Fraud Data Entry
# Canonical copy — lives in the repo so `git pull` + `cp` on the server
# syncs config changes together with code.
#
# Install on server (one-time):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud
#   sudo ln -sf /etc/nginx/sites-available/cyberfraud /etc/nginx/sites-enabled/cyberfraud
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires a cert + key at:
#   /etc/ssl/certs/cyberfraud.crt
#   /etc/ssl/private/cyberfraud.key
# Regenerate a self-signed pair with:
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/cyberfraud.key \
#     -out /etc/ssl/certs/cyberfraud.crt \
#     -subj "/C=IN/ST=Karnataka/L=Bangalore/O=KSP/CN=117.200.49.38"

# ─── HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/cyberfraud.crt;
    ssl_certificate_key /etc/ssl/private/cyberfraud.key;

    # TLS 1.2+ only; modern cipher suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Suppress nginx version in Server header (VAPT 7.6 / CWE-200)
    server_tokens off;
    proxy_hide_header Server;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend build
    root /opt/cyberfraud/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health pass-through to FastAPI (gunicorn on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/cyberfraud_access.log;
    error_log /var/log/nginx/cyberfraud_error.log;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}
