# Nginx site config for Cyber Fraud Data Entry
# Canonical copy — lives in the repo so `git pull` + `cp` on the server
# syncs config changes together with code.
#
# Install on server (one-time):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud
#   sudo ln -sf /etc/nginx/sites-available/cyberfraud /etc/nginx/sites-enabled/cyberfraud
#   sudo nginx -t && sudo systemctl reload nginx
#
# On updates:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud
#   sudo nginx -t && sudo systemctl reload nginx

# Suppress nginx version in Server header (CWE-200)
# Note: this directive is http-scoped, so it also goes in /etc/nginx/nginx.conf
# under `http { server_tokens off; }`. Listed here as a reminder.

server {
    listen 443 ssl http2;
    server_name _;

    # TLS certs — update paths to match the server's actual cert location
    ssl_certificate     /etc/letsencrypt/live/cyberfraud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberfraud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Security headers ──────────────────────────────────────────────
    # Content Security Policy — blocks inline scripts + external script
    # sources, mitigating any residual stored-XSS (CWE-20)
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Do NOT expose upstream server version ─────────────────────────
    proxy_hide_header Server;

    # Static frontend build
    root /opt/cyberfraud/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health pass-through to FastAPI (gunicorn on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
