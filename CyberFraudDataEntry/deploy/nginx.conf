# Nginx site config for Cyber Fraud Data Entry
# Canonical copy — lives in the repo so `git pull` + `cp` on the server
# syncs config changes together with code.
#
# Install on server (one-time):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud
#   sudo ln -sf /etc/nginx/sites-available/cyberfraud /etc/nginx/sites-enabled/cyberfraud
#   sudo nginx -t && sudo systemctl reload nginx
#
# On updates:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud
#   sudo nginx -t && sudo systemctl reload nginx
#
# This config is HTTP-only (per ProductionDeployment.md §13 Option A —
# acceptable for internal KSWAN network). A separate nginx.conf.tls
# template with SSL directives exists for when/if the server gets a
# proper cert — swap the two files when that happens.

server {
    listen 80 default_server;
    server_name _;

    # Suppress nginx version in Server header (CWE-200)
    server_tokens off;
    proxy_hide_header Server;

    # Security headers
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend build
    root /opt/cyberfraud/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + health pass-through to FastAPI (gunicorn on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/cyberfraud_access.log;
    error_log /var/log/nginx/cyberfraud_error.log;
}
