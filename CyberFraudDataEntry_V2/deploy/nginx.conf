# Nginx site config for Cyber Fraud Data Entry V2.
#
# V2 deliberately listens on 8443 (HTTPS) instead of 443 so it can
# coexist with the V1 production deployment on the same box. Once V2
# replaces V1, swap this listen directive back to 443 and decommission
# the V1 site.
#
# Install on server (one-time):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberfraud_v2
#   sudo ln -sf /etc/nginx/sites-available/cyberfraud_v2 /etc/nginx/sites-enabled/cyberfraud_v2
#   sudo nginx -t && sudo systemctl reload nginx
#
# Reuses the same self-signed cert as V1 (same hostname / IP).

# ─── HTTPS server (V2 on 8443) ────────────────────────────────────────
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/cyberfraud.crt;
    ssl_certificate_key /etc/ssl/private/cyberfraud.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Suppress nginx version in Server header (VAPT 7.6 / CWE-200)
    server_tokens off;
    proxy_hide_header Server;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # V2 static frontend build
    root /opt/cyberfraud_v2/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # V2 backend on :8001 (V1 owns :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/cyberfraud_v2_access.log;
    error_log /var/log/nginx/cyberfraud_v2_error.log;
}
